name: Update AUR Package(sparkle)

on:
  schedule:
    - cron: "0 0 * * *" # 每24小时
  workflow_dispatch:
permissions:
    contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:base-devel # 直接使用包含 base-devel 的镜像
    steps:
      - name: Pre-install Git
        run: |
          pacman -Syu --noconfirm git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for updates
        id: nvchecker
        run: |
          # 1. 安装官方 nvchecker（Arch extra 包，含 nvchecker / nvcmp）
          # 不走 pip：CI 上 PyPI 会 Connection reset by peer
          pacman -Syu --noconfirm nvchecker
          
          # 2. 运行检查
          # 注意：第一次运行时，因为没有旧版本记录，它会把当前最新版视为"新版本"
          nvchecker -c nvchecker.toml
          
          # 3. 获取比较结果
          # nvcmp 会输出类似 "package: old_ver -> new_ver" 的内容
          # 如果没有更新，变量为空
          output=$(nvcmp -c nvchecker.toml)
          
          echo "Check result: $output"
          
          if [ -n "$output" ]; then
            # 提取版本号 (假设 output 格式为: name: old -> new)
            # awk '{print $4}' 取第4列，即新版本号
            new_ver=$(echo "$output" | awk '{print $4}')
            
            echo "New version detected: $new_ver"
            
            # 将结果写入 GitHub Outputs 供后续步骤使用
            echo "version=$new_ver" >> $GITHUB_OUTPUT

            mv nvchecker_newver.json nvchecker_oldver.json
          else
            echo "No updates found."
            echo "version=" >> $GITHUB_OUTPUT
          fi

      # 2. 如果有更新，进行打包处理
      - name: Update PKGBUILD
        if: steps.nvchecker.outputs.version != '' && steps.nvchecker.outputs.version != null
        env:
          NEW_VER: ${{ steps.nvchecker.outputs.version }}
        run: |
          # 安装依赖
          pacman -Syu --noconfirm git pacman-contrib
          
          # 修改版本号
          sed -i "s/^pkgver=.*/pkgver=\"$NEW_VER\"/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Verify Build
        if: steps.nvchecker.outputs.version != '' && steps.nvchecker.outputs.version != null
        env:
          NEW_VER: ${{ steps.nvchecker.outputs.version }}
        run: |
          # 1. 创建一个名为 builder 的普通用户 (makepkg 不允许 root)
          useradd -m builder
          # 2. 赋予该用户 sudo 权限 (安装依赖需要)
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          # 3. 修正当前目录权限，让 builder 能读写
          chown -R builder:builder .
          
          # 4. 切换身份运行构建
          # sparkle-bin 同时发布 x86_64 和 aarch64。
          # GitHub runner 只能构建当前架构，updpkgsums 也只会改写当前架构的 checksum，
          # 另一个架构的 deb 单独下载并写回 sha256。
          su builder -c "updpkgsums"
          if [ "$(uname -m)" = "aarch64" ]; then
            other_deb="sparkle-linux-${NEW_VER}-amd64.deb"
            other_field="sha256sums"
            other_srcinfo_key="source"
          else
            other_deb="sparkle-linux-${NEW_VER}-arm64.deb"
            other_field="sha256sums_aarch64"
            other_srcinfo_key="source_aarch64"
          fi
          curl -fsSL -o "$other_deb" \
            "https://github.com/xishang0128/sparkle/releases/download/${NEW_VER}/${other_deb}"
          other_sum=$(sha256sum "$other_deb" | awk '{print $1}')
          rm -f "$other_deb"
          sed -i "s/^${other_field}=.*/${other_field}=('${other_sum}')/" PKGBUILD

          # -s: 自动安装依赖
          # -i: 构建后安装 (测试 package() 阶段)
          # --noconfirm: 不询问确认
          # --clean: 清理
          # || exit 1: 如果失败，确保这一步返回错误码，中断 Workflow
          su builder -c "makepkg -si --noconfirm --clean && makepkg --printsrcinfo > .SRCINFO" || exit 1

          # printsrcinfo 只写出当前架构的 source。补回另一个架构，否则 AUR 会丢掉对应 deb。
          other_url="https://github.com/xishang0128/sparkle/releases/download/${NEW_VER}/${other_deb}"
          if ! grep -q "^[[:space:]]*${other_srcinfo_key} = ${other_url}$" .SRCINFO; then
            grep -v "^[[:space:]]*${other_srcinfo_key} = " .SRCINFO \
              | grep -v "^[[:space:]]*${other_field} = " > .SRCINFO.tmp
            printf '\t%s = %s\n\t%s = %s\n' \
              "$other_srcinfo_key" "$other_url" "$other_field" "$other_sum" >> .SRCINFO.tmp
            mv .SRCINFO.tmp .SRCINFO
          fi

      - name: Publish to AUR
        if: steps.nvchecker.outputs.version != '' && steps.nvchecker.outputs.version != null && success()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          NEW_VER: ${{ steps.nvchecker.outputs.version }}
        run: |
          # 安装依赖
          pacman -Syu --noconfirm openssh      
          # 配置 SSH 并推送
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o StrictHostKeyChecking=no'
          
          git clone ssh://aur@aur.archlinux.org/sparkle-bin.git aur-repo
          cp PKGBUILD .SRCINFO aur-repo/
          cd aur-repo
          
          git config user.name 'huochenghai'
          git config user.email 'huochenghai@gmail.com'
          git add -f PKGBUILD .SRCINFO
          git diff-index --quiet HEAD || git commit -m "Update to $NEW_VER"
          git push

          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "*"
          git config user.name 'huochenghai'
          git config user.email 'huochenghai@gmail.com'
          git add PKGBUILD .SRCINFO nvchecker_oldver.json
          if git diff --staged --quiet; then
            exit 0
          else
            git commit -m "Auto update state to $NEW_VER"
            git push
          fi
